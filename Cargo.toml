[workspace]
members = ["."]
resolver = "3"

[package]
name = "foundry-mcp"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "CLI for scaffolding and syncing Foundry project context in ~/.foundry/"
license = "MIT"
authors = ["Chris Freeman <cfreeman86@gmail.com>"]
repository = "https://github.com/cafreeman/foundry-mcp"
homepage = "https://github.com/cafreeman/foundry-mcp"
documentation = "https://docs.rs/foundry-mcp"
readme = "README.md"
keywords = ["ai", "project-management", "cli", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".cursor/",
    ".cargo/",
]

[[bin]]
name = "foundry"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_fs = "1.1"
serde_json = "1"

[lints.clippy]
all = "deny"
redundant_clone = "deny"
map_flatten = "deny"
manual_ok_or = "deny"
option_if_let_else = "deny"
redundant_closure = "deny"
unnecessary_filter_map = "deny"
